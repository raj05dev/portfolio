<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Background Elements -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3f4f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e5e7eb" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg-gradient)" rx="20" ry="20"/>
  
  <!-- Desk -->
  <rect x="100" y="400" width="600" height="20" rx="5" ry="5" fill="#64748b"/>
  <rect x="150" y="420" width="500" height="10" rx="2" ry="2" fill="#475569"/>
  
  <!-- Monitor -->
  <rect x="300" y="200" width="240" height="160" rx="5" ry="5" fill="#1e293b"/>
  <rect x="310" y="210" width="220" height="130" rx="2" ry="2" fill="#0f172a"/>
  
  <!-- Code on Screen -->
  <g fill="#6366f1">
    <rect x="320" y="220" width="80" height="6" rx="1" ry="1" opacity="0.8"/>
    <rect x="320" y="235" width="120" height="6" rx="1" ry="1" opacity="0.6"/>
    <rect x="340" y="250" width="160" height="6" rx="1" ry="1" opacity="0.8"/>
    <rect x="320" y="265" width="100" height="6" rx="1" ry="1" opacity="0.7"/>
    <rect x="340" y="280" width="140" height="6" rx="1" ry="1" opacity="0.9"/>
    <rect x="320" y="295" width="90" height="6" rx="1" ry="1" opacity="0.6"/>
    <rect x="340" y="310" width="130" height="6" rx="1" ry="1" opacity="0.8"/>
  </g>
  
  <!-- Monitor Stand -->
  <rect x="360" y="360" width="120" height="10" rx="2" ry="2" fill="#334155"/>
  <rect x="400" y="370" width="40" height="30" rx="2" ry="2" fill="#475569"/>
  
  <!-- Laptop -->
  <g>
    <rect x="150" y="320" width="120" height="80" rx="5" ry="5" fill="#334155"/>
    <rect x="155" y="325" width="110" height="65" rx="2" ry="2" fill="#1e293b"/>
    <rect x="150" y="400" width="120" height="10" rx="2" ry="2" fill="#475569"/>
  </g>
  
  <!-- Coffee Mug -->
  <g>
    <rect x="550" y="350" width="30" height="50" rx="5" ry="5" fill="#475569"/>
    <rect x="545" y="350" width="40" height="10" rx="5" ry="5" fill="#334155"/>
    <rect x="555" y="360" width="20" height="30" rx="2" ry="2" fill="#94a3b8"/>
  </g>
  
  <!-- Tech Icons -->
  <!-- React -->
  <g transform="translate(180, 350) scale(0.4)">
    <circle cx="50" cy="50" r="20" fill="none" stroke="#61dafb" stroke-width="4"/>
    <ellipse cx="50" cy="50" rx="45" ry="15" fill="none" stroke="#61dafb" stroke-width="4" transform="rotate(0 50 50)"/>
    <ellipse cx="50" cy="50" rx="45" ry="15" fill="none" stroke="#61dafb" stroke-width="4" transform="rotate(60 50 50)"/>
    <ellipse cx="50" cy="50" rx="45" ry="15" fill="none" stroke="#61dafb" stroke-width="4" transform="rotate(120 50 50)"/>
  </g>
  
  <!-- Angular -->
  <g transform="translate(500, 350) scale(0.4)">
    <path d="M50,0 L100,35 L90,85 L50,100 L10,85 L0,35 Z" fill="#dd0031"/>
    <path d="M50,0 L50,100 L90,85 L100,35 Z" fill="#c3002f"/>
    <path d="M50,20 L20,80 L35,80 L40,65 L60,65 L65,80 L80,80 Z M50,40 L55,55 L45,55 Z" fill="#ffffff"/>
  </g>
  
  <!-- .NET -->
  <g transform="translate(400, 350) scale(0.4)">
    <rect x="20" y="20" width="60" height="60" rx="10" ry="10" fill="#512bd4"/>
    <text x="50" y="65" font-family="Arial" font-size="40" font-weight="bold" fill="white" text-anchor="middle">.NET</text>
  </g>
  
  <!-- Node.js -->
  <g transform="translate(300, 350) scale(0.4)">
    <path d="M50,10 L90,30 L90,70 L50,90 L10,70 L10,30 Z" fill="#8cc84b"/>
    <path d="M50,20 L80,35 L80,65 L50,80 L20,65 L20,35 Z" fill="#333333"/>
  </g>
  
  <!-- Person (Developer) -->
  <g transform="translate(600, 320)">
    <!-- Head -->
    <circle cx="50" cy="50" r="25" fill="#fcd34d"/>
    
    <!-- Hair -->
    <path d="M25,50 Q30,20 50,25 Q70,20 75,50 L75,40 Q70,15 50,20 Q30,15 25,40 Z" fill="#44403c"/>
    
    <!-- Face -->
    <circle cx="40" cy="45" r="3" fill="#44403c"/> <!-- Left Eye -->
    <circle cx="60" cy="45" r="3" fill="#44403c"/> <!-- Right Eye -->
    <path d="M45,60 Q50,65 55,60" fill="none" stroke="#44403c" stroke-width="2" stroke-linecap="round"/> <!-- Smile -->
    
    <!-- Body -->
    <path d="M50,75 L50,150 M30,100 L70,100" fill="none" stroke="#6366f1" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Arms -->
    <path d="M30,100 L10,120" fill="none" stroke="#fcd34d" stroke-width="8" stroke-linecap="round"/>
    <path d="M70,100 L90,120" fill="none" stroke="#fcd34d" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Floating Elements -->
  <g>
    <!-- Code Brackets -->
    <text x="120" y="150" font-family="monospace" font-size="40" fill="url(#accent-gradient)">{}</text>
    <text x="650" y="180" font-family="monospace" font-size="40" fill="url(#accent-gradient)">&lt;/&gt;</text>
    
    <!-- Cloud Elements -->
    <circle cx="180" cy="100" r="20" fill="#e2e8f0" opacity="0.7"/>
    <circle cx="200" cy="90" r="25" fill="#e2e8f0" opacity="0.7"/>
    <circle cx="220" cy="100" r="20" fill="#e2e8f0" opacity="0.7"/>
    
    <circle cx="580" cy="120" r="15" fill="#e2e8f0" opacity="0.7"/>
    <circle cx="600" cy="110" r="20" fill="#e2e8f0" opacity="0.7"/>
    <circle cx="620" cy="120" r="15" fill="#e2e8f0" opacity="0.7"/>
  </g>
</svg>
